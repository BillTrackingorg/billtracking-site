# Permalink + bill pages — billtracking.org/p/<id> and /b/<polity>/<slug>
#
# TWO page types, one renderer, one run:
#  • /p/<id> — every post the app can "Copy link" as a static page: the post as
#    itself (the shared artifact), an honest CTA, the D22 dateline, any public
#    correction. The OS-can't-route fallback + the OG/share card for every link.
#    A post that belongs to a bill points its canonical at that bill (below).
#  • /b/<polity>/<slug> — the INDEXABLE unit: one page per bill (bounded by bills
#    that MOVE, not by time), showing the same merged path the app's bill screen
#    shows (parity proven by the app's scripts/check-permalinks.js). Post pages
#    are its citations. Bill pages carry `noindex` until the owner's Gate-2 flip
#    (INDEX_BILL_PAGES in the generator) — published now as citations only.
#
# THE RENDERER IS THE APP'S OWN CODE. tools/bt-site.cjs is `bt-core` compiled
# from the app repo's TypeScript (web-overhaul plan §12(1), D27): the adapter,
# the ids, the one date formatter, the bill identity, the path merge, the two
# content models and their HTML renderers — the same modules the phone runs. No
# second implementation of a product rule lives on this side any more.
# tools/generate.py, the Python port it replaces, stays in the tree until the
# swap is proven byte-for-byte over the live pages; this workflow no longer
# calls it, and no step here needs Python.
#
# THE BOTS ARE NEVER TOUCHED. This job PULLS the published feed files + the
# per-bill path artifacts (public GitHub Pages, the same bytes the phones read),
# runs tools/bt-site.cjs, and commits ONLY the generated p/ + b/ + view/ trees
# and the bill sitemap. Nothing here can change a post, a tally, a path, or a
# bot. b/ is SEPARATE from the app's own web export (bill/[ref].html) — never
# touched here. view/ is the published packaged form of the same render (index,
# shaped months, per-bill views, the legislature registry): data for any future
# surface, written by this job alone.
#
# NO CREDENTIALS. This runs IN the site repo with the workflow's own built-in
# GITHUB_TOKEN — no personal token, no secret, no expiry. The `permissions`
# block below is the whole grant: contents write on THIS repo, nothing else,
# readable by anyone in this file. (An earlier design ran this from the
# private app repo with a fine-grained PAT; the owner rightly asked for the
# cleaner shape, 2026-08-16.) Public repo ⇒ Actions minutes are free.
#
# Cadence: every 15 minutes. This repo is PUBLIC, so Actions minutes are free
# and the cost of a run is the fetch itself. The web is no longer a 2-hourly
# shadow of the app: the feed pages read the published record live, and a shared
# link should land on a real page rather than on the 404 resolver's client-side
# render — so the gap between "the bot posted" and "the page exists" is worth
# closing. GitHub schedules on a best-effort basis and runs late under load; the
# cron is a request, not a promise, and no page claims a cadence.
# Manual dispatch re-renders now.
#
# Failure posture (loudness doctrine): any fetch/render error fails the run
# and nothing is committed. A partial or SHRUNKEN tree is never published:
# past months are immutable (D17), so a past-month 404 or empty file, a
# page-count shrink (posts OR bills), or a stray non-generated file under p/ or
# b/ all fail loudly. A path artifact 404 is the one tolerated miss — a bill
# with no path yet is normal (posts-only, the app does the same); any OTHER
# path-fetch code fails the run (the artifact may exist and we just couldn't
# get it — never publish a page that would falsely say "not published yet").

name: permalinks
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: permalinks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 20 — the runtime the committed bundle targets (esbuild
      # `target: node20`; app repo site-build/core/build.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The renderer is a COMMITTED artifact, not something this job builds: it
      # is produced in the (private) app repo by a green `npm run check` and
      # copied here. If it is missing, say so in one line rather than letting
      # node fail with a module-resolution error at the bottom of a log. The
      # selftest is the bundle proving ITSELF — the fixture assertions compiled
      # into it — before it is trusted with the live record.
      - name: Check the renderer, and let it prove itself
        run: |
          set -euo pipefail
          for f in tools/bt-site.cjs tools/glyphs.svg; do
            [ -f "$f" ] || { echo "::error::$f is missing — the site cannot be rendered without the compiled core (app repo: npm run build:core)"; exit 1; }
          done
          node tools/bt-site.cjs --selftest

      # The public feed — every month file since the epoch, plus the PER-BOT
      # corrections sheets the bots write and the app reads (us-overrides +
      # eu-overrides; the root overrides.jsonl is a dead legacy). A 404 is a
      # quiet month ONLY for the current month; a 404 or empty body for any
      # PAST month is an upstream failure. curl gets retries + a time budget;
      # its status is read on its own line so a transport error can never
      # concatenate into a bogus code.
      - name: Fetch the published feed
        env:
          FEED: https://billtrackingorg.github.io/billtracking-feed
        run: |
          set -euo pipefail
          mkdir -p feed
          fetch() {  # fetch URL DEST -> echoes the HTTP code (000 on transport failure)
            local out
            out=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$2" -w '\n%{http_code}' "$1" 2>/dev/null) || { echo 000; return; }
            printf '%s\n' "$out" | tail -n1
          }
          y=2026; m=7   # FEED_EPOCH 2026-07 (app feed-client.ts) — nothing older exists
          now_y=$(date -u +%Y); now_m=$(date -u +%-m)
          while [ "$y" -lt "$now_y" ] || { [ "$y" -eq "$now_y" ] && [ "$m" -le "$now_m" ]; }; do
            mm=$(printf '%02d' "$m")
            current=0; [ "$y" -eq "$now_y" ] && [ "$m" -eq "$now_m" ] && current=1
            for bot in us eu; do
              f="${bot}-${y}-${mm}.jsonl"
              code=$(fetch "$FEED/$f" "feed/$f")
              if [ "$code" = "404" ]; then
                rm -f "feed/$f"
                if [ "$current" = "1" ]; then echo "no $f yet (current month)";
                else echo "::error::$f returned 404 — a PAST month is immutable and cannot vanish; refusing to render a shrunken site"; exit 1; fi
              elif [ "$code" != "200" ]; then echo "::error::feed fetch $f returned $code"; exit 1;
              else
                lines=$(grep -c . "feed/$f" || true)
                if [ "$lines" -eq 0 ] && [ "$current" = "0" ]; then echo "::error::$f is EMPTY (200, 0 lines) — a past month cannot be empty"; exit 1; fi
                echo "got $f ($lines lines)"
              fi
            done
            m=$((m+1)); if [ "$m" -gt 12 ]; then m=1; y=$((y+1)); fi
          done
          for bot in us eu; do
            code=$(fetch "$FEED/${bot}-overrides.jsonl" "feed/${bot}-overrides.jsonl")
            [ "$code" = "200" ] || { echo "::error::${bot}-overrides.jsonl returned $code"; exit 1; }
            echo "${bot}-overrides: $(grep -c . "feed/${bot}-overrides.jsonl" || true) lines"
          done
          [ "$(ls feed/*-20*.jsonl 2>/dev/null | wc -l)" -gt 0 ] || { echo "::error::no feed files at all — refusing to render an empty site"; exit 1; }

      # BILL-PATH ARTIFACTS. The bill pages (/b/) show the same full procedural
      # record the app's bill screen shows, which lives in per-bill artifacts at
      # {FEED}/paths/*.json (the exact files the app's path-client reads). GitHub
      # Pages gives no directory listing, so the RENDERER tells us which files a
      # bill needs (--list-paths, which reads `post.bill.pathFile` — the same
      # string the bill key and the /b/ slug are made of, so there is ONE
      # derivation and it is the app's) and we fetch exactly those.
      #  • 200 → use it.  • 404 → the bill has no path published yet — NORMAL (the
      #    app renders posts-only too); skip, no error.  • anything else → the
      #    artifact may EXIST but we couldn't fetch it, and rendering posts-only
      #    would falsely say "not published yet" — so FAIL the run (loudness
      #    doctrine: never publish a page we can't stand behind). Bots untouched.
      - name: Fetch bill-path artifacts
        env:
          FEED: https://billtrackingorg.github.io/billtracking-feed
        run: |
          set -euo pipefail
          mkdir -p paths
          node tools/bt-site.cjs --feed feed --list-paths > paths.txt
          echo "bills needing a path artifact: $(grep -c . paths.txt || true)"
          while read -r name; do
            [ -n "$name" ] || continue
            case "$name" in */*|*..*) echo "::error::refusing suspicious artifact name: $name"; exit 1;; esac
            code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "paths/$name" -w '%{http_code}' "$FEED/paths/$name" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then :
            elif [ "$code" = "404" ]; then rm -f "paths/$name"   # no path yet — posts-only, honest
            else echo "::error::path artifact $name returned $code — refusing to render it posts-only (it may exist)"; exit 1; fi
          done < paths.txt
          echo "fetched $(ls paths 2>/dev/null | wc -l) path artifacts"

      # The renderer scans the feed dir for *-overrides.jsonl itself. It renders
      # into a scratch dir — never straight into the checkout — so the guards
      # below can compare before anything in the repo changes. Bill pages carry
      # `noindex` until the Gate-2 flip (INDEX_BILL_PAGES); this run publishes
      # them as citations only.
      #
      # It EXITS NON-ZERO on anything that would make a page untrustworthy, so a
      # failed render commits nothing (loudness doctrine). Ordinary gaps — a
      # record the app also drops, a path artifact that would not parse, a
      # legislature this build does not carry — are ::warning:: lines it prints
      # at COLUMN 0, which is where GitHub's parser reads them: nothing needs
      # re-emitting the way the Python logger's level prefix did.
      - name: Render the pages
        run: |
          set -euo pipefail
          mkdir -p out
          node tools/bt-site.cjs --feed feed --paths paths --out out
          n=$(ls out/p/*.html | grep -vc 'index.html' || true)
          b=$(find out/b -type f -name '*.html' ! -name index.html | wc -l)
          echo "rendered $n post pages, $b bill pages"
          [ "$n" -gt 0 ] || { echo "::error::the renderer produced no post pages"; exit 1; }
          [ -d out/view/v1 ] || { echo "::error::the renderer produced no view/ tree"; exit 1; }

      # Publish = replace p/, b/ AND view/ wholesale + the bill sitemap. All three
      # trees are TRACKED but written by this job alone (only generated files live
      # there; guarded), so the replace is safe. b/ is the SEO bill pages ONLY — a
      # SEPARATE tree from the app's own web export (bill/[ref].html), which this
      # job never touches. Then commit with the built-in token.
      - name: Commit the pages
        run: |
          set -euo pipefail
          # p/ and b/ must contain ONLY generated files. Anything else = someone
          # hand-placed a file there; refuse rather than silently delete it.
          if [ -d p ]; then
            stray=$(cd p && ls | grep -Ev '^([a-z]{2,12}-[0-9]{8}-[0-9a-f]{8}\.html|index\.html|sitemap\.xml)$' || true)
            [ -z "$stray" ] || { echo "::error::p/ contains non-generated files — refusing to replace it: $stray"; exit 1; }
          fi
          if [ -d b ]; then
            stray=$(find b -type f | grep -Ev '^b/[a-z0-9]{2,12}/([a-z0-9][a-z0-9-]*\.html|index\.html)$' || true)
            [ -z "$stray" ] || { echo "::error::b/ contains unexpected files — refusing to replace it: $stray"; exit 1; }
          fi
          # view/ is workflow-owned too — the published packaged form of this same
          # render (plan §12(1)). Same rule as p/ and b/: anything else in there
          # was hand-placed, and this job refuses rather than silently deleting it.
          if [ -d view ]; then
            stray=$(find view -type f | grep -Ev '^view/v1/([a-z]{2,12}-[0-9]{4}-[0-9]{2}\.json|index\.json|registry\.json|bills/[a-z0-9]{2,12}/[a-z0-9][a-z0-9-]*\.json)$' || true)
            [ -z "$stray" ] || { echo "::error::view/ contains unexpected files — refusing to replace it: $stray"; exit 1; }
          fi
          # SHRINK GUARDS by SET-DIFF (exact — no fuzzy count). A page/bill in the
          # committed tree but ABSENT from this render is either a SANCTIONED
          # remove-duplicate (listed in the generator's suppression manifest) or an
          # upstream gap (D17: nothing published ever leaves; a bill never un-exists).
          # Any UNLISTED disappearance fails the run. This replaces a
          # remove-duplicate COUNT that could over-count a free-text match and mask a
          # real shrink, and that was cumulative not per-run (guard finding, 2026-08-17).
          # `|| true` on comm keeps set -e from firing when there are no missing lines;
          # the `exit 1` inside the loop still propagates (last pipeline stage).
          if [ -d p ]; then
            comm -23 \
              <( (cd p && ls *.html 2>/dev/null) | grep -v '^index\.html$' | sed 's/\.html$//' | sort ) \
              <( (cd out/p && ls *.html) | grep -v '^index\.html$' | sed 's/\.html$//' | sort ) \
            | while IFS= read -r id; do
                [ -n "$id" ] || continue
                grep -qxF "$id" out/.suppressed-pages 2>/dev/null \
                  || { echo "::error::/p/ lost ${id}.html and it is NOT a sanctioned remove-duplicate — upstream gap, refusing to publish"; exit 1; }
              done
          fi
          if [ -d b ]; then
            comm -23 \
              <( (cd b && find . -type f -name '*.html' ! -name index.html) | sed 's|^\./||; s|\.html$||' | sort ) \
              <( (cd out/b && find . -type f -name '*.html' ! -name index.html) | sed 's|^\./||; s|\.html$||' | sort ) \
            | while IFS= read -r slug; do
                [ -n "$slug" ] || continue
                grep -qxF "$slug" out/.suppressed-bills 2>/dev/null \
                  || { echo "::error::/b/ lost ${slug}.html and it is NOT a sanctioned removal — upstream gap, refusing to publish"; exit 1; }
              done
          fi
          new=$(ls out/p/*.html | grep -vc index.html || true)
          newb=$(find out/b -type f -name '*.html' ! -name index.html | wc -l)
          rm -rf p b view
          cp -r out/p p
          cp -r out/b b
          cp -r out/view view
          cp out/bill-sitemap.xml bill-sitemap.xml
          git config user.name "billtracking-permalinks"
          git config user.email "permalinks@billtracking.org"
          git add -A p b view bill-sitemap.xml
          if git diff --cached --quiet; then echo "no page changes"; exit 0; fi
          git commit -q -m "permalinks: render $new post + $newb bill pages from the published feed"
          # The repo also takes owner pushes; a race is ordinary. p/, b/ and view/
          # are ours alone, so a rebase can never conflict with a hand-authored
          # file. A 15-minute cadence makes the race commoner, not different.
          for attempt in 1 2 3; do
            if git push -q; then echo "published $new post + $newb bill pages"; exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the new head"
            git pull --rebase -q || { echo "::error::rebase failed"; exit 1; }
          done
          echo "::error::could not push after 3 attempts"; exit 1
